<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luma Studio — Web 3D Editor</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #202124; --panel: #292a2d; --dark: #191a1c;
      --raised: #303136; --control: #36373b; --line: #45474e;
      --text: #dedee2; --muted: #a1a5b0; --accent: #ed9545;
      --sidebar: 310px;
    }

    * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

    body {
      margin: 0; overflow: hidden; background: var(--bg); color: var(--text);
      font: 12px Inter, system-ui, sans-serif;
    }

    button, input, select { font: inherit; }
    button, select {
      color: var(--text); background: var(--control); border: 1px solid var(--line);
      border-radius: 5px; padding: 6px 9px; cursor: pointer;
    }
    button:hover { filter: brightness(1.15); }
    button:disabled, input:disabled { opacity: .45; cursor: not-allowed; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
    button.active {
      background: color-mix(in srgb, var(--accent) 24%, var(--panel));
      border-color: color-mix(in srgb, var(--accent) 65%, var(--line));
    }
    button.primary {
      background: var(--accent); border-color: var(--accent);
      color: #17191e; font-weight: 750;
    }

    input {
      width: 100%; min-width: 0; padding: 6px; color: var(--text);
      background: var(--dark); border: 1px solid var(--line); border-radius: 4px;
    }
    input[type="checkbox"] { width: auto; accent-color: var(--accent); }
    input[type="range"] { padding: 0; accent-color: var(--accent); }
    input[type="color"] { height: 29px; padding: 2px; }

    .spacer { flex: 1; }

    .app-header {
      height: 42px; display: flex; align-items: center; gap: 5px;
      padding: 0 10px; background: var(--panel); border-bottom: 1px solid #111;
    }
    .brand {
      display: flex; align-items: center; gap: 7px; color: var(--text);
      text-decoration: none; font-weight: 700; letter-spacing: .8px; margin-right: 12px;
    }
    .brand-icon { color: var(--accent); font-size: 25px; }

    .menu { position: relative; }
    .menu summary { list-style: none; padding: 8px; cursor: pointer; border-radius: 4px; }
    .menu summary::-webkit-details-marker { display: none; }
    .menu[open] summary, .menu summary:hover { background: var(--control); }
    .menu-popup {
      position: absolute; left: 0; top: 33px; z-index: 50; width: 220px;
      padding: 5px; max-height: calc(100dvh - 80px); overflow: auto;
      background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
      box-shadow: 0 12px 35px #0008;
    }
    .menu-popup button {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; border: 0; background: transparent; padding: 9px; text-align: left;
    }
    .menu-popup button:hover { background: var(--raised); }

    .workspace-tabs { display: flex; align-self: stretch; gap: 2px; margin-left: 10px; }
    .workspace-tabs button {
      margin-top: 8px; padding: 0 12px; border: 0; border-radius: 5px 5px 0 0;
      background: transparent; color: var(--muted);
    }
    .workspace-tabs button.active { background: var(--raised); color: var(--text); }

    main { display: flex; height: calc(100dvh - 68px); }
    .workspace { display: flex; flex: 1; min-width: 0; flex-direction: column; }

    .viewport-toolbar {
      display: flex; align-items: center; flex-wrap: wrap; gap: 7px;
      min-height: 37px; padding: 5px 9px; background: var(--raised); border-bottom: 1px solid #17181b;
    }

    #viewport { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #393c43; }
    #viewport canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    .tool-rail {
      position: absolute; z-index: 3; top: 12px; left: 9px;
      display: flex; flex-direction: column; gap: 5px;
    }
    .tool-rail button { width: 36px; height: 36px; padding: 0; font-size: 20px; background: var(--panel); }

    .viewport-overlay {
      position: absolute; top: 14px; left: 58px; display: flex; flex-direction: column;
      gap: 5px; pointer-events: none; color: #d9dce5; text-shadow: 0 1px 4px #000;
    }

    .view-buttons { position: absolute; top: 13px; right: 13px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .view-buttons button { font-size: 10px; background: #252830d9; border-color: #ffffff24; }

    #viewportHint {
      position: absolute; bottom: 13px; left: 13px; padding: 7px 10px;
      color: #bac0cf; background: #1c2028b8; border: 1px solid #ffffff16;
      border-radius: 5px; font-size: 10px; pointer-events: none;
    }

    #dropOverlay {
      position: absolute; inset: 12px; z-index: 20; display: none; place-items: center;
      padding: 20px; text-align: center; background: #22394eed; color: #dbefff;
      border: 2px dashed #85bce9; border-radius: 10px; font-size: 19px; pointer-events: none;
    }
    #dropOverlay.visible { display: grid; }

    #toast {
      display: none; position: absolute; bottom: 55px; left: 50%; transform: translateX(-50%);
      z-index: 40; max-width: 85%; padding: 11px 15px; text-align: center;
      background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 30px #0007;
    }

    aside {
      display: flex; flex-direction: column; width: var(--sidebar); min-width: 250px;
      background: var(--panel); border-left: 2px solid #151618;
    }

    .panel-heading {
      display: flex; align-items: center; gap: 8px; padding: 10px 11px;
      background: var(--raised); border-bottom: 1px solid #17181a; font-size: 11px; font-weight: 650;
    }
    .panel-heading small { margin-left: auto; color: var(--muted); font-weight: 400; }

    #outliner { height: 210px; flex-shrink: 0; overflow: auto; padding: 5px 0; }
    .object-row { display: flex; align-items: center; gap: 5px; min-height: 27px; padding-right: 8px; cursor: pointer; }
    .object-row:hover { background: var(--raised); }
    .object-row.selected { background: color-mix(in srgb, var(--accent) 23%, var(--panel)); box-shadow: inset 3px 0 var(--accent); }
    .object-row .object-icon { color: var(--accent); }
    .object-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #properties { flex: 1; overflow: auto; }
    .property-section { padding: 13px; border-bottom: 1px solid var(--line); }
    .property-section h2 { margin: 0 0 12px; font-size: 11px; }

    .field { display: grid; grid-template-columns: 88px 1fr; align-items: center; gap: 8px; margin: 9px 0; }
    .field > label { color: var(--muted); }
    .xyz { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .xyz input { padding: 5px 2px; text-align: center; }

    .two-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 7px; }
    .full { width: 100%; margin-top: 7px; }

    footer {
      display: flex; align-items: center; gap: 12px; height: 26px; padding: 0 10px;
      background: var(--panel); border-top: 1px solid #111; color: var(--muted); font-size: 10px;
    }
    .progress-track { width: 90px; height: 4px; background: var(--line); border-radius: 10px; overflow: hidden; }
    #progressFill { width: 0; height: 100%; background: var(--accent); }

    dialog {
      width: min(560px, calc(100vw - 28px)); max-height: 85dvh; padding: 0;
      color: var(--text); background: var(--panel); border: 1px solid var(--line);
      border-radius: 14px; box-shadow: 0 25px 100px #0009;
    }
    dialog::backdrop { background: #080b12b0; backdrop-filter: blur(5px); }
    .dialog-header { display: flex; justify-content: space-between; padding: 20px; border-bottom: 1px solid var(--line); }
    .dialog-body { padding: 0 20px; }
    .setting { display: grid; grid-template-columns: 1fr 180px; align-items: center; gap: 15px; margin: 12px 0; }

    .command-search { display: flex; align-items: center; gap: 10px; padding: 14px; }
    .command-search input { flex: 1; padding: 11px; font-size: 14px; }
    #commandResults { max-height: 380px; overflow: auto; padding: 0 8px 8px; }
    .command-item { display: flex; justify-content: space-between; width: 100%; padding: 11px; background: transparent; border: 0; }
    .command-item.chosen { background: color-mix(in srgb, var(--accent) 20%, var(--panel)); }

    body.focus-mode aside { display: none; }
    body.hide-tips #viewportHint { display: none !important; }
    body.path-mode #toolRail { display: none; }
    body.output-mode #viewportOverlay, body.output-mode #viewButtons, body.output-mode #viewportHint { display: none; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <header class="app-header">
    <a class="brand" href="./"><span class="brand-icon">◉</span><span>LUMA <b>STUDIO</b></span></a>

    <details class="menu">
      <summary>File</summary>
      <div class="menu-popup">
        <button id="newScene">New empty scene</button>
        <button id="importScene">Import models…</button>
        <button id="exportScene">Export GLB</button>
        <button id="exportPNG">Save viewport PNG</button>
      </div>
    </details>

    <details class="menu">
      <summary>Edit</summary>
      <div class="menu-popup">
        <button id="undo">Undo <kbd>Ctrl Z</kbd></button>
        <button id="redo">Redo <kbd>Ctrl Shift Z</kbd></button>
        <button id="duplicate">Duplicate <kbd>Shift D</kbd></button>
        <button id="delete">Delete selected</button>
      </div>
    </details>

    <details class="menu" id="addMenu">
      <summary>Add</summary>
      <div class="menu-popup" id="addItems"></div>
    </details>

    <nav class="workspace-tabs">
      <button class="active" data-workspace="layout">Layout</button>
      <button data-workspace="modeling">Modeling</button>
      <button data-workspace="shading">Shading</button>
      <button data-workspace="rendering">Rendering</button>
    </nav>

    <div class="spacer"></div>

    <button id="openCommands">⌕ Commands</button>
    <button id="focusMode">Focus</button>
    <button id="openSettings">⚙ Customize</button>
  </header>

  <main>
    <section class="workspace">
      <div class="viewport-toolbar">
        <select id="transformSpace">
          <option value="world">Global</option>
          <option value="local">Local</option>
        </select>
        <button id="frameSelected">Frame</button>
        <label><input id="showGrid" type="checkbox" checked> Grid</label>
        <div class="spacer"></div>
        <div>
          <button data-mode="solid">Solid</button>
          <button class="active" data-mode="shaded">Shaded</button>
          <button data-mode="wire">Wire</button>
          <button data-mode="rendered">Rendered</button>
          <button data-mode="output">Output</button>
        </div>
      </div>

      <div id="viewport">
        <div class="tool-rail" id="toolRail">
          <button class="active" data-tool="translate">↔</button>
          <button data-tool="rotate">⟳</button>
          <button data-tool="scale">⛶</button>
          <button id="quickAdd">＋</button>
        </div>

        <div class="viewport-overlay" id="viewportOverlay">
          <strong id="viewName">User Perspective</strong>
          <span id="selectionLabel">Scene Collection</span>
          <span id="renderInfo">Material preview</span>
        </div>

        <div class="view-buttons" id="viewButtons">
          <button data-view="front">Front</button>
          <button data-view="right">Right</button>
          <button data-view="top">Top</button>
          <button data-view="iso">⌂</button>
        </div>

        <div id="viewportHint">Orbit: Drag · Pan: Right-Drag · Zoom: Wheel · Select: Click</div>
        <div id="dropOverlay">Drop GLB, GLTF, or OBJ files</div>
        <div id="toast"></div>
      </div>
    </section>

    <aside id="sidebar">
      <div class="panel-heading"><span>▤ Scene Collection</span><small id="objectCount">0 objects</small></div>
      <div id="outliner"></div>

      <div class="panel-heading"><span>⚙ Properties</span></div>

      <div id="properties">
        <section class="property-section">
          <h2>Transform</h2>
          <input id="objectName" placeholder="Select an object" disabled>

          <div class="field">
            <label>Location</label>
            <div class="xyz" data-property="position">
              <input type="number" step=".1" data-axis="x">
              <input type="number" step=".1" data-axis="y">
              <input type="number" step=".1" data-axis="z">
            </div>
          </div>
          <div class="field">
            <label>Rotation °</label>
            <div class="xyz" data-property="rotation">
              <input type="number" step="5" data-axis="x">
              <input type="number" step="5" data-axis="y">
              <input type="number" step="5" data-axis="z">
            </div>
          </div>
          <div class="field">
            <label>Scale</label>
            <div class="xyz" data-property="scale">
              <input type="number" step=".1" data-axis="x">
              <input type="number" step=".1" data-axis="y">
              <input type="number" step=".1" data-axis="z">
            </div>
          </div>

          <div class="two-buttons">
            <button id="duplicateObject">Duplicate</button>
            <button id="deleteObject">Delete</button>
          </div>
        </section>

        <section class="property-section" id="materialSection">
          <h2>Surface / Light</h2>
          <div class="field"><label>Color</label><input id="surfaceColor" type="color" value="#b6bec8"></div>
          <div class="field"><label>Roughness</label><input id="roughness" type="range" min="0" max="1" step=".01" value=".5"></div>
          <div class="field"><label>Metallic</label><input id="metalness" type="range" min="0" max="1" step=".01" value="0"></div>
          <div class="field"><label>Light Power</label><input id="lightPower" type="number" min="0" max="10000" step="5" value="20"></div>
        </section>

        <section class="property-section" id="renderSection">
          <h2>Path Tracing</h2>
          <div class="field">
            <label>Samples</label>
            <select id="samples"><option>32</option><option selected>128</option><option>256</option><option>512</option></select>
          </div>
          <div class="field"><label>Light Bounces</label><input id="bounces" type="number" min="1" max="16" value="6"></div>
          <button class="primary full" id="startRender">▶ Start Path
